<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>my silly goofy box site</title>
<link rel="shortcut icon" href="favicon.ico" />
<style>
   div{
    width: 150px;
    height: 150px;
    background-color: beige;
    border: 2px solid rgb(246, 214, 166);
   }
   #one{
    position:static;
    z-index: 100;
   }
   #two{
    position:relative;
    left: 100px;
    top: -50px;
   }
   #three{
    position: absolute;
    background-color: antiquewhite;
    right: 150px;
    top:150px;
   }
   #four{
    position: fixed;
    background-color: burlywood;
    right: 0;
    bottom: 200px;
   }
   #five{
    position: sticky;
    top: 0;
    background-color: rgb(235, 209, 174);

   }
</style>
</head>
            
<body>
<h1>Position Demo</h1>
<p>Mwahahaha!>:)
</p>

<hr>

<h2></h2>
<div id="one"></div>

<div id="five"></div>

<div id="two"></div>

<div id="three"></div>

<div id="four"></div>

</html>
