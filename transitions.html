<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>transitions</title>
<link rel="shortcut icon" href="favicon.ico" />
<style>
    body{
        background: rgb(154, 194, 240);
    }
    #one{
        width:100px;
        height:100px;
        background:plum;
        border:2px solid purple;
        margin: 100px;
        transition:transform 2s, background 1s;
    
    }
    #one:hover{
        transform: rotate(360deg)scale(2);
        background:rgb(167, 7, 167);
    }
    #two{
        width:100px;
        height:100px;
        background:rgb(137, 137, 236);
        border:2px solid rgb(31, 34, 160);
        margin: 100px;
        transition:transform 2s, background 1s;
        
    }
    #two:hover{
        transform: skewX(45deg);
        background:rgb(46, 71, 211);
    }
    #three{
        width:100px;
        height:100px;
        background:rgb(123, 171, 124);
        border:2px solid rgb(50, 98, 64);
        margin: 100px;
        transition:transform 2s, background 1s;
    
    }
    #three:hover{
        transform: matrix(1, 4 ,6, 8, 10, 12);
        background:rgb(13, 116, 32);
    }
    #four{
        width:100px;
        height:100px;
        background:rgb(136, 243, 181);
        border:2px solid rgb(57, 116, 90);
        margin: 100px;
        transition:transform 2s, background 1s;
    }
    #four:hover{
        transform: rotateX(180deg) rotateY(180deg) rotateZ(180deg);
        background:rgb(42, 136, 111);
    }
    div{text-align: center;
    }
</style>
</head>
<body>
<div id="one">spin</div>

<div id="two">skew</div>

<div id="three">matrix</div>

<div id="four">3D</div>
<P><a href="index.html"><span class="ryan"><ins>bye bye go home</ins></span></a></P>
</body>

</html>
